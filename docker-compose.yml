services:
  lightsout:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lightsout
      POSTGRES_USER: lightsout
      POSTGRES_PASSWORD: lightsout
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
volumes:
  postgres_data:
